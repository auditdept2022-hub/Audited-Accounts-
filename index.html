  // ---- Auto-save for Auditor Remarks ----
  // Instead of requiring a tap on "Save", once the user pauses typing for
  // a short moment (and we're online) the remarks are saved automatically
  // in the background, same as the other dropdown fields already do. The
  // manual Save button still works too, for anyone who wants to save
  // immediately without waiting for the pause.
  var remarksAutoSaveTimer = null;
  var REMARKS_AUTOSAVE_DELAY_MS = 900;
  // Used by the "Already made a payment" quick-remark button: detects
  // whether that standard line is already present in the saved remarks
  // (so the button can show as "marked"), and stops a second tap from
  // stacking a duplicate line on top of an existing one.
  // Today's date as 'YYYY-MM-DD', for the <input type="date"> next to the
  // "Already made a payment" button (that input format is the one thing
  // <input type="date"> requires).
  function todayISODate(){
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  var ALREADY_PAID_MARKER_RE = /already made a payment/i;

  // Auto-generated "Unit status / Payment mode" remarks line. Whenever
  // either dropdown is changed, a single summary line is added/updated/
  // removed at the top of Auditor Remarks so the auditor doesn't have to
  // type it by hand. Identified by the "Unit/Payment:" prefix so it can
  // be found and replaced without touching anything typed by hand
  // elsewhere in the box -- same idea as ALREADY_PAID_MARKER_RE above.
  var AUTO_FIELD_REMARK_RE = /^Unit\/Payment:.*$/im;

  function autoFieldRemarkLine(r){
    var unitStatus = String((r && r['Unit status']) || '').trim();
    var paymentMode = String((r && r['Payment mode']) || '').trim();
    if (!unitStatus && !paymentMode) return '';
    var parts = [];
    if (unitStatus) parts.push('unit status is ' + unitStatus);
    if (paymentMode) parts.push('payment mode is ' + paymentMode);
    return 'Unit/Payment: ' + parts.join(', ') + '.';
  }

  // Strips out only the auto-generated line(s) (case: none, one, or a
  // stray extra), keeping every other line -- including manually typed
  // remarks -- untouched.
  function stripAutoFieldRemarkLine(text){
    return String(text || '')
      .split('\n')
      .filter(function(line){ return !AUTO_FIELD_REMARK_RE.test(line); })
      .join('\n')
      .replace(/^\n+/, '');
  }

  // Called after Unit status or Payment mode is changed via the drawer's
  // dropdowns. Rebuilds the auto line from the row's current values and
  // saves it into Auditor Remarks the same way the "Already made a
  // payment" button does (drops it into the textarea, then runs the
  // normal remarks save path -- online save, offline queue, and the
  // "Recent saved remarks" log all keep working exactly as before).
  async function syncAutoFieldRemarkLine(){
    if (!state.selected || state.savingRemarks) return;
    var b = currentBranch();
    var row = state.selected._row;
    var ta = document.getElementById('remarksInput');
    var current = ta ? ta.value : (state.selected['Auditor Remarks'] || '');
    var rest = stripAutoFieldRemarkLine(current);
    var line = autoFieldRemarkLine(state.selected);
    var updated = line ? (rest.trim() ? (line + '\n' + rest) : line) : rest;
    if (updated === current) return; // nothing to do -- avoid a redundant save
    if (ta) ta.value = updated;
    if (b && state.selected) saveDraft(b.branch, row, updated);
    await handleSaveRemarks();
  }

  function scheduleRemarksAutoSave(){
    if (remarksAutoSaveTimer) clearTimeout(remarksAutoSaveTimer);
    remarksAutoSaveTimer = setTimeout(function(){
      remarksAutoSaveTimer = null;
      var online = (typeof navigator === 'undefined') || navigator.onLine;
      if (!online || !state.selected || state.savingRemarks) return;
      var ta = document.getElementById('remarksInput');
      var b = currentBranch();
      if (!ta || !b) return;
      var savedVal = state.selected['Auditor Remarks'] || '';
      if (ta.value === savedVal) return; // nothing changed since last save
      handleSaveRemarks();
    }, REMARKS_AUTOSAVE_DELAY_MS);
  }

  // ---- Speech-to-text for Auditor Remarks ----
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micSupported = !!SpeechRecognitionCtor;
  var micRecognizer = null;
  var micBaseText = ''; // remarks text as it was when recording started

  function micToolbarHtml(){
    if (!micSupported){
      return '<div class="mic-hint err mic-standalone-hint">Voice dictation isn\'t supported in this browser. Try Chrome or Edge.</div>';
    }
    var hint = '';
    if (state.micRecording) hint = '<div class="mic-hint mic-standalone-hint">Listening… speak naturally, tap the mic to stop.</div>';
    else if (state.micError) hint = '<div class="mic-hint err mic-standalone-hint">' + esc(state.micError) + '</div>';
    return hint;
  }

  // Small round mic icon embedded inside the remarks textarea itself
  // (top-left corner) instead of a separate full-width button above it.
  function micButtonHtml(){
    if (!micSupported) return '';
    var label = state.micRecording ? 'Stop dictation' : 'Dictate remarks';
    return (
      '<button type="button" class="mic-btn-embedded' + (state.micRecording ? ' recording' : '') + '" id="micBtn" title="' + esc(label) + '" aria-label="' + esc(label) + '">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>' +
      '</button>'
    );
  }

  function stopMic(){
    if (micRecognizer){
      try{ micRecognizer.stop(); }catch(e){}
    }
    state.micRecording = false;
    state.micInterim = '';
    releaseMicStream();
  }

  var micStream = null; // keeps the getUserMedia track open while dictating

  function micPermissionDeniedMessage(){
    // file:// pages can't show a permission prompt at all in most browsers —
    // give a message that explains that instead of a generic "blocked" one.
    if (location.protocol === 'file:'){
      return 'This page was opened directly from a file, so the browser won\'t show a mic permission prompt. Open it through a web address (http/https) instead, then allow the mic when asked.';
    }
    return 'Microphone access was blocked. Click the padlock/site-info icon next to the address bar, allow Microphone for this page, then tap the mic again.';
  }

  function startMic(){
    if (!micSupported){
      state.micError = 'Voice dictation isn\'t supported in this browser.';
      renderKeepScroll();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      state.micError = micPermissionDeniedMessage();
      renderKeepScroll();
      return;
    }

    state.micError = '';
    renderKeepScroll();

    // Explicitly ask for mic permission first. This is what actually triggers
    // the browser's "Allow microphone?" prompt on a direct tap; some browsers
    // won't reliably show that prompt from SpeechRecognition.start() alone.
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        micStream = stream;
        beginRecognition();
      })
      .catch(function(err){
        state.micRecording = false;
        if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')){
          state.micError = micPermissionDeniedMessage();
        } else if (err && err.name === 'NotFoundError'){
          state.micError = 'No microphone was found on this device.';
        } else {
          state.micError = 'Could not access the microphone (' + (err && err.name ? err.name : 'unknown error') + ').';
        }
        renderKeepScroll();
      });
  }

  function beginRecognition(){
    var ta = document.getElementById('remarksInput');
    micBaseText = ta ? ta.value : '';
    if (micBaseText && !/\s$/.test(micBaseText)) micBaseText += ' ';

    micRecognizer = new SpeechRecognitionCtor();
    micRecognizer.lang = 'en-PH';
    micRecognizer.continuous = true;
    micRecognizer.interimResults = true;

    micRecognizer.onresult = function(event){
      var finalChunk = '';
      var interimChunk = '';
      for (var i = event.resultIndex; i < event.results.length; i++){
        var res = event.results[i];
        if (res.isFinal) finalChunk += res[0].transcript;
        else interimChunk += res[0].transcript;
      }
      if (finalChunk){
        micBaseText += finalChunk.trim() + ' ';
      }
      var taEl = document.getElementById('remarksInput');
      if (taEl) taEl.value = micBaseText;
      var micB = currentBranch();
      if (micB && state.selected) saveDraft(micB.branch, state.selected._row, micBaseText);
      state.micInterim = interimChunk.trim();
      var interimDiv = document.querySelector('.mic-interim');
      if (interimDiv) interimDiv.textContent = state.micInterim ? ('Hearing: "' + state.micInterim + '"') : '';
    };

    micRecognizer.onerror = function(event){
      state.micRecording = false;
      state.micInterim = '';
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        state.micError = micPermissionDeniedMessage();
      } else if (event.error === 'no-speech'){
        state.micError = 'No speech detected — tap the mic and try again.';
      } else {
        state.micError = 'Dictation stopped (' + event.error + ').';
      }
      releaseMicStream();
      renderKeepScroll();
    };

    micRecognizer.onend = function(){
      // Browsers auto-stop after a pause; restart seamlessly if the user hasn't pressed Stop.
      if (state.micRecording){
        try{ micRecognizer.start(); }catch(e){}
      } else {
        releaseMicStream();
        renderKeepScroll();
      }
    };

    try{
      micRecognizer.start();
      state.micRecording = true;
      state.micError = '';
      state.micInterim = '';
      renderKeepScroll();
    }catch(e){
      state.micError = 'Could not start the microphone.';
      releaseMicStream();
      renderKeepScroll();
    }
  }

  function releaseMicStream(){
    if (micStream){
      try{ micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      micStream = null;
    }
  }

  function handleMicToggle(){
    if (state.micRecording) stopMic();
    else startMic();
    renderKeepScroll();
  }

  function esc(s){
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Looks up a value on a row object by name, tolerating differences in
  // capitalization/spacing between the code's expected field name and the
  // actual column header text that came from the sheet (e.g. "Total Due
  // this Month" vs "Total Due This Month"). Falls back to the exact key
  // first (fast path), then does a normalized case-insensitive match.
  function getField(r, name){
    if (!r) return '';
    if (r.hasOwnProperty(name)) return r[name];
    var norm = String(name).toLowerCase().replace(/\s+/g, ' ').trim();
    for (var k in r){
      if (!r.hasOwnProperty(k)) continue;
      if (String(k).toLowerCase().replace(/\s+/g, ' ').trim() === norm) return r[k];
    }
    return '';
  }

  // "Beg Bal" is imported under several possible header spellings
  // (see doImport) because different branch tabs use different column
  // names for it. Try them all so the value doesn't go missing just
  // because a hardcoded 'Beg Bal' lookup doesn't match that tab's header.
  var BEG_BAL_ALIASES = ['Beg Bal', 'Beginning Balance', 'Remaining Balance', 'Beginning Balance/Remaining Balance'];
  function getBegBal(r){
    for (var i = 0; i < BEG_BAL_ALIASES.length; i++){
      var v = getField(r, BEG_BAL_ALIASES[i]);
      if (v !== '' && v !== undefined && v !== null) return v;
    }
    return '';
  }

  // The monthly-due amount is imported into a column literally titled
  // "Due This Month" (see doImport, col I) — not "Total Due this Month".
  // The drawer happens to work regardless because it just lists whatever
  // headers exist on the sheet, but the table looked up the wrong exact
  // name and always showed "—". Try every spelling actually in use so the
  // table stops losing this value.
  var TOTAL_DUE_ALIASES = ['Total Due this Month', 'Total Due This Month', 'Due This Month', 'Due this Month'];
  function getTotalDue(r){
    for (var i = 0; i < TOTAL_DUE_ALIASES.length; i++){
      var v = getField(r, TOTAL_DUE_ALIASES[i]);
      if (v !== '' && v !== undefined && v !== null) return v;
    }
    return '';
  }

  // Turns a raw date value (Date object, "2026-05-09", or a serial number
  // from a spreadsheet) into a short, readable "May 9, 2026" style string.
  // Falls back to the original value untouched if it can't be parsed.
  function fmtDatePretty(val){
    var d = null;
    if (val instanceof Date){
      d = val;
    } else if (typeof val === 'number'){
      // Google Sheets/Excel serial date (days since 1899-12-30)
      d = new Date(Math.round((val - 25569) * 86400 * 1000));
    } else {
      var s = String(val).trim();
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      else {
        var parsed = new Date(s);
        if (!isNaN(parsed.getTime())) d = parsed;
      }
    }
    if (!d || isNaN(d.getTime())) return val;
    return d.toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' });
  }

  var DATE_FIELD_NAMES = {'si date':1, 'date of audit':1, 'last payment':1};

  function fmtValue(key, val){
    if (val === undefined || val === null || val === '') return '—';
    var kNorm = String(key).toLowerCase().replace(/\s+/g, ' ').trim();
    if (DATE_FIELD_NAMES[kNorm]) return fmtDatePretty(val);
    if (kNorm === 'terms'){
      var n = Number(val);
      if (!isNaN(n) && String(val).trim() !== ''){
        return n.toLocaleString('en-PH') + ' month' + (n === 1 ? '' : 's');
      }
      return val;
    }
    var k = kNorm;
    // "Due Day" is a calendar day-of-month (e.g. the 30th), not an
    // amount — exclude it explicitly before the general "due" match
    // below, or it would wrongly get a peso sign.
    if (k === 'due day'){
      return typeof val === 'number' ? val.toLocaleString('en-PH') : val;
    }
    // Beg Bal (and the other amount columns) sometimes arrive as real
    // numbers and sometimes as plain strings straight from the sheet
    // (e.g. "5000" or "5,000.00") depending on how that branch's tab was
    // typed, and its header can itself be spelled a few different ways
    // ("Beg Bal", "Beg. Bal", "BegBal", "Beginning Balance", ...). Match
    // loosely on the letters alone (whitespace/punctuation stripped) so
    // any of those spellings is still recognized as a money field, then
    // parse either a number or a numeric-looking string into one so the
    // ₱ sign always gets applied.
    var kBare = k.replace(/[^a-z]/g, '');
    var isMoneyField = k.indexOf('balance') > -1 || k.indexOf('due') > -1 || k.indexOf('payment') > -1 ||
        k.indexOf('advance') > -1 || k.indexOf('penalty') > -1 || k === 'ma' ||
        kBare === 'begbal' || kBare === 'beginningbalance' || kBare === 'remainingbalance';
    if (isMoneyField){
      var num = typeof val === 'number' ? val : Number(String(val).replace(/[₱,\s]/g, ''));
      if (!isNaN(num) && String(val).trim() !== ''){
        return '₱' + num.toLocaleString('en-PH', {maximumFractionDigits:2});
      }
      return val;
    }
    if (typeof val === 'number'){
      return val.toLocaleString('en-PH');
    }
    return val;
  }

  function statusClass(val){
    if (!val) return 'default';
    var v = String(val).toLowerCase();
    if (v.indexOf('good') > -1 || v.indexOf('paid') > -1 || v.indexOf('current') > -1) return 'good';
    if (v.indexOf('bad') > -1 || v.indexOf('delay') > -1 || v.indexOf('overdue') > -1 || v.indexOf('default') > -1) return 'bad';
    return 'default';
  }

  function unitStatusClass(val){
    if (!val) return 'default';
    var v = String(val).toLowerCase();
    if (v.indexOf('good') > -1) return 'unit-good';
    if (v.indexOf('not confirmed') > -1) return 'unit-notconfirmed';
    if (v.indexOf('missing') > -1) return 'unit-missing';
    if (v.indexOf('total wreck') > -1) return 'unit-wreck';
    if (v.indexOf('impounded') > -1) return 'unit-impounded';
    if (v.indexOf('pulled out') > -1) return 'unit-pulledout';
    if (v.indexOf('tracing') > -1) return 'unit-tracing';
    if (v.indexOf('car-napped') > -1 || v.indexOf('carnapped') > -1) return 'unit-carnapped';
    if (v.indexOf('damage') > -1) return 'unit-damage';
    return 'default';
  }

  function paymentModeClass(val){
    if (!val) return 'default';
    var v = String(val).toLowerCase();
    if (v.indexOf('branch') > -1) return 'pay-branch';
    if (v.indexOf('field') > -1) return 'pay-field';
    if (v === 'n/a' || v.indexOf('n/a') > -1) return 'pay-na';
    if (v === 'ip') return 'pay-ip';
    if (v.indexOf('online') > -1) return 'pay-online';
    return 'default';
  }

  function fmtClock(d){
    return d.toLocaleTimeString('en-PH', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true }) +
      ' · ' + d.toLocaleDateString('en-PH', { month:'short', day:'numeric' });
  }

  function fmtSyncAgo(d){
    if (!d) return 'Not synced yet';
    var diffSec = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
    if (diffSec < 5) return 'Synced just now';
    if (diffSec < 60) return 'Synced ' + diffSec + 's ago';
    var diffMin = Math.round(diffSec / 60);
    if (diffMin < 60) return 'Synced ' + diffMin + 'm ago';
    var diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return 'Synced ' + diffHr + 'h ago';
    return 'Synced ' + d.toLocaleDateString('en-PH', { month:'short', day:'numeric' });
  }

  function syncAgeClass(d){
    if (!d) return '';
    var diffMin = (Date.now() - d.getTime()) / 60000;
    if (diffMin < 2) return 'fresh';
    if (diffMin < 15) return 'ok';
    return 'stale';
  }

  function fmtFullTimestamp(d){
    return d.toLocaleString('en-PH', { dateStyle:'medium', timeStyle:'medium' });
  }

  function qkey(branch, row, field){ return branch + '::' + row + '::' + field; }

  function rowHasPending(branch, row){
    return state.pendingQueue.some(function(i){ return i.branch === branch && i.row === row; });
  }

  // ---- Local persistence layer ----
  // Uses real browser localStorage so data survives page reloads, the
  // back button, closing the tab/app, or losing connectivity — none of
  // which a page-memory-only store would survive. Falls back to an
  // in-memory object if localStorage is unavailable (e.g. private mode
  // with storage disabled), so the app never throws.
  var LS_PREFIX = 'auditDashboard::';
  var memoryFallback = {};
  function lsGet(key){
    try{
      var v = window.localStorage.getItem(LS_PREFIX + key);
      return v === null ? undefined : v;
    }catch(e){
      return memoryFallback[key];
    }
  }
  function lsSet(key, value){
    try{ window.localStorage.setItem(LS_PREFIX + key, value); return true; }
    catch(e){ memoryFallback[key] = value; return false; }
  }

  async function persistPendingQueue(){
    lsSet('pending-writes', JSON.stringify(state.pendingQueue));
  }

  // ---- Full dataset persistence ----
  // Whatever was last successfully loaded from the Google Sheet is saved to
  // localStorage, so that closing/backgrounding the app (even long enough
  // for Android to kill it) and reopening it -- with or without a
  // connection -- shows the last-known data immediately instead of a blank
  // "you're offline" screen. Pending local edits are re-applied on top so
  // nothing typed while offline is ever lost or overwritten by stale data.
  function saveCachedBranches(){
    try{
      lsSet('cached-branches', JSON.stringify(state.branches));
      lsSet('cached-branches-time', new Date().toISOString());
    }catch(e){ /* storage full or unavailable - safe to ignore, in-memory data still works */ }
  }
  function loadCachedBranches(){
    var v = lsGet('cached-branches');
    if (!v) return false;
    try{
      var parsed = JSON.parse(v);
      if (Array.isArray(parsed) && parsed.length){
        state.branches = parsed;
        var t = lsGet('cached-branches-time');
        if (t){ state.lastSynced = new Date(t); }
        return true;
      }
    }catch(e){}
    return false;
  }

  // ---- Remarks draft persistence ----
  // Whatever the auditor types into the remarks box is saved to localStorage
  // on every keystroke, separate from the "Save remarks" action. This means
  // that if the tab is closed, the app is backgrounded, or the connection
  // drops before the auditor taps Save, the typed text is still there the
  // next time this record is opened -- online or offline. The draft is only
  // cleared once "Save remarks" is actually pressed.
  function draftKey(branch, row){ return 'draft::' + branch + '::' + row; }
  function saveDraft(branch, row, value){ lsSet(draftKey(branch, row), value); }
  function loadDraft(branch, row){
    var v = lsGet(draftKey(branch, row));
    return (v === undefined) ? null : v;
  }
  function clearDraft(branch, row){
    try{ window.localStorage.removeItem(LS_PREFIX + draftKey(branch, row)); }
    catch(e){ delete memoryFallback[draftKey(branch, row)]; }
  }

  async function loadPendingQueue(){
    var v = lsGet('pending-writes');
    if (v){ try{ state.pendingQueue = JSON.parse(v) || []; }catch(e){ state.pendingQueue = []; } }
  }

  function queueWrite(branch, row, field, value, label){
    var key = qkey(branch, row, field);
    state.pendingQueue = state.pendingQueue.filter(function(i){ return qkey(i.branch, i.row, i.field) !== key; });
    state.pendingQueue.push({ branch:branch, row:row, field:field, value:value, label:label, ts:Date.now() });
    persistPendingQueue();
    // Try to sync immediately instead of waiting for the next timer tick —
    // this is what makes changes go out fast when the connection is fine.
    if (typeof navigator === 'undefined' || navigator.onLine) flushQueue();
  }

  function unqueueWrite(branch, row, field){
    var key = qkey(branch, row, field);
    state.pendingQueue = state.pendingQueue.filter(function(i){ return qkey(i.branch, i.row, i.field) !== key; });
    persistPendingQueue();
  }

  // Closes the customer detail view by walking browser history back one
  // step (consuming the entry pushed when it was opened) rather than
  // clearing state directly. This keeps history and what's on screen in
  // sync, so the back button/gesture and the on-screen X/overlay-tap all
  // behave the same way.
  function closeDetail(){
    if (state.selected){ history.back(); }
  }
  window.addEventListener('popstate', function(){
    if (state.selected){
      stopMic();
      state.selected = null;
      state.openPicker = '';
      render();
    }
  });

  function applyPendingToBranches(){
    state.pendingQueue.forEach(function(item){
      var b = state.branches.find(function(x){ return x.branch === item.branch; });
      if (!b) return;
      var r = b.rows.find(function(x){ return x._row === item.row; });
      if (r) r[item.field] = item.value;
    });
  }

  function syncStatusInfo(){
    if (!state.online){
      return {
        dotClass: 'stale',
        text: 'Offline' + (state.pendingQueue.length ? ' · ' + state.pendingQueue.length + ' pending' : ''),
        title: state.pendingQueue.length
          ? state.pendingQueue.length + ' change(s) saved on this device — will sync once you\'re back online.'
          : 'No internet connection right now.'
      };
    }
    if (state.pendingQueue.length){
      return {
        dotClass: 'syncing',
        text: 'Syncing ' + state.pendingQueue.length + ' change' + (state.pendingQueue.length > 1 ? 's' : '') + '...',
        title: 'Sending changes saved on this device to your Google Sheet.'
      };
    }
    return {
      dotClass: syncAgeClass(state.lastSynced),
      text: fmtSyncAgo(state.lastSynced),
      title: state.lastSynced ? 'Last updated ' + fmtFullTimestamp(state.lastSynced) : ''
    };
  }

  function tickClock(){
    var clockEl = document.getElementById('liveClock');
    if (clockEl) clockEl.textContent = fmtClock(new Date());
    var agoEl = document.getElementById('syncAgo');
    var dotEl = document.getElementById('syncDot');
    if (agoEl || dotEl){
      var info = syncStatusInfo();
      if (agoEl){ agoEl.textContent = info.text; agoEl.title = info.title; }
      if (dotEl) dotEl.className = 'sync-dot ' + info.dotClass;
    }
  }

  var clockStarted = false;
  var tickCount = 0;
  function startClock(){
    if (clockStarted) return;
    clockStarted = true;
    tickClock();
    setInterval(function(){
      tickClock();
      tickCount++;
      // Retry every 2s instead of 4s/15s so queued changes go out faster.
      if (tickCount % 2 === 0 && state.online && state.pendingQueue.length){ flushQueue(); }
      var readyToRefresh = state.online && !state.loading && !state.selected && document.visibilityState === 'visible';
      if (state._syncWasFailing){
        // While a sync is actively failing, retry sooner than the normal
        // 30s cadence (5s, then 10s, then 20s, capped at 30s) so a fixed
        // Web app URL / access setting / temporary network blip recovers
        // quickly instead of leaving a stale "Sync failed" state sitting
        // around for up to half a minute.
        if (!state._retryDelayMs) state._retryDelayMs = 5000;
        if (readyToRefresh && (tickCount % Math.round(state._retryDelayMs / 1000)) === 0){
          state._retryDelayMs = Math.min(state._retryDelayMs * 2, 30000);
          fetchData({ silent: true });
        }
      } else if (tickCount % 30 === 0 && readyToRefresh){
        // Light background refresh every 30s so everyone sees fresh data
        // without tapping the sync button — silent (no spinner, no rebuild
        // unless data actually changed) so it doesn't cause the periodic
        // full-page flicker. Skipped while a record is open so it doesn't
        // interrupt someone mid-edit, and while offline.
        fetchData({ silent: true });
      }
    }, 1000);
  }

  window.addEventListener('online', function(){
    state.online = true;
    flushQueue();
    fetchData();
    render();
  });
  window.addEventListener('offline', function(){
    state.online = false;
    render();
  });

  // Mobile browsers suspend timers when a tab/app is backgrounded, so the
  // 4s retry above can stall for a while. Catch back up the moment the
  // page becomes visible again (switching apps, unlocking the phone,
  // coming back from the browser's back/forward cache) or regains focus.
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){
      state.online = (typeof navigator !== 'undefined') ? navigator.onLine : state.online;
      if (state.online){ flushQueue(); fetchData(); }
      render();
    }
  });
  window.addEventListener('pageshow', function(){
    state.online = (typeof navigator !== 'undefined') ? navigator.onLine : state.online;
    if (state.online){ flushQueue(); fetchData(); }
  });
  window.addEventListener('focus', function(){
    if (state.online) flushQueue();
  });
  // Best-effort final attempt if the page is closed/backed-out of while a
  // save is still in flight or queued.
  window.addEventListener('pagehide', function(){
    if (state.pendingQueue.length && typeof navigator !== 'undefined' && navigator.onLine) flushQueue();
  });

  async function loadUrl(){
    var v = lsGet('apps-script-url');
    if (v) state.url = v;
    else await saveUrl(DEFAULT_URL);
  }
  async function saveUrl(u){
    lsSet('apps-script-url', u);
  }

  // ---- Google Sheet "preview" link ----
  // The app only talks to the Apps Script Web app URL, which isn't
  // something a person can open in a browser to see the actual sheet.
  // This stores the real Google Sheet URL (the one from the browser's
  // address bar when the sheet itself is open) purely so the Preview
  // button below can open it in a new tab.
  async function loadSheetViewUrl(){
    var v = lsGet('sheet-view-url');
    if (v) state.sheetViewUrl = v;
  }
  async function saveSheetViewUrl(u){
    lsSet('sheet-view-url', u);
  }

  async function fetchData(opts){
    var silent = !!(opts && opts.silent);
    if (typeof navigator !== 'undefined' && !navigator.onLine){
      state.online = false;
      if (!state.branches.length){
        // No cache and no connection - genuinely nothing to show yet.
        state.error = 'You appear to be offline and no data has been loaded on this device yet. Connect to the internet once to load data, then it will keep working offline from then on.';
      } else {
        // We have last-known data (from this session or from the on-device
        // cache) - show it instead of an error, with any pending edits
        // already applied.
        state.error = '';
      }
      renderKeepScroll();
      return;
    }
    // Silent (background) refreshes don't flip on the loading spinner or
    // force a re-render before the fetch even starts — that pre-fetch
    // render was one of the main causes of the periodic full-page flicker,
    // since it fired every ~20s even when nothing on the sheet had changed.
    if (!silent){ state.loading = true; state.error = ''; renderKeepScroll(); }
    try{
      // cache:'no-store' plus a unique timestamp query param stop the
      // browser (and any service worker) from silently reusing an old
      // response for this same URL — without this, "Sync now" could look
      // like it did nothing because it was served a stale cached reply
      // instead of actually hitting the Apps Script backend.
      var fetchUrl = state.url + (state.url.indexOf('?') === -1 ? '?' : '&') + '_ts=' + Date.now();
      var res = await fetchWithTimeout(fetchUrl, { method:'GET', cache:'no-store' }, FETCH_TIMEOUT_MS);
      var data = await res.json();
      if (!data.success) throw new Error(data.error || 'Could not load data.');
      var newBranches = data.branches || [];
      // Skip the (expensive, flicker-causing) full re-render entirely when
      // the freshly-fetched data is identical to what's already on screen —
      // which, for a silent background refresh, is true most of the time.
      var changed = JSON.stringify(newBranches) !== JSON.stringify(state.branches);
      state.branches = newBranches;
      if (state.branches.length && !state.branches.some(function(b){ return b.branch === state.activeBranch; })){
        state.activeBranch = state.branches[0].branch;
        changed = true;
      }
      applyPendingToBranches();
      state.lastSynced = new Date();
      state.online = true;
      saveCachedBranches();
      if (state._syncWasFailing){
        // The previous sync attempt(s) had failed and this one succeeded —
        // let the bell reflect that the problem has resolved itself
        // instead of leaving the last-seen status stuck on "Failed".
        state._syncWasFailing = false;
        state._retryDelayMs = 0;
        resolveNotificationsByTitle('Sync failed');
        pushNotification('synced', 'Sync restored', 'Data loaded successfully from the Google Sheet after an earlier connection problem.', { status: 'resolved' });
      }
      if (silent && !changed){
        // Nothing visibly changed — just quietly update the "synced Xs ago"
        // label instead of rebuilding the whole screen.
        tickClock();
        return;
      }
    }catch(e){
      state.online = (typeof navigator !== 'undefined') ? navigator.onLine : state.online;
      if (state.branches.length){
        // Keep showing the data we already have rather than replacing it with an error screen.
        state.error = '';
      } else {
        state.error = 'Could not connect to the Google Sheet. Make sure the Web app URL is correct and access is set to "Anyone". (' + e.message + ')';
      }
      state._syncWasFailing = true;
      if (!silent){
        var offlineNow = (typeof navigator !== 'undefined' && !navigator.onLine);
        pushNotification('error', 'Sync failed', 'Could not load data from the Google Sheet: ' + e.message, {
          status: 'failed',
          cause: offlineNow
            ? 'Your device currently has no internet connection.'
            : 'The dashboard could not reach the Google Sheet Web app — this usually means the Web app URL is wrong, the deployment\u2019s access isn\u2019t set to "Anyone", the Apps Script deployment was updated/redeployed without refreshing the URL here, or a temporary network problem. Details: ' + e.message,
          solution: offlineNow
            ? 'Reconnect to the internet, then tap the sync (refresh) button, or wait — the dashboard will keep retrying automatically and will sync as soon as you\u2019re back online.'
            : 'Open Connection settings and confirm the Web app URL matches the current Apps Script deployment with access set to "Anyone", then tap the sync (refresh) button to try again.'
        });
      }
    }
    state.loading = false;
    renderKeepScroll();
  }

  function updateLocalField(branch, row, field, value){
    var b = state.branches.find(function(x){ return x.branch === branch; });
    if (b){
      var r = b.rows.find(function(x){ return x._row === row; });
      if (r) r[field] = value;
    }
    if (state.selected && state.selected._row === row) state.selected[field] = value;
  }

  async function attemptRemoteSave(branch, row, field, value){
    var res;
    try{
      res = await fetchWithTimeout(state.url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ branch:branch, row:row, field:field, value:value }),
        keepalive: true
      }, FETCH_TIMEOUT_MS);
    }catch(networkErr){
      var e1 = new Error('offline');
      e1.isNetworkError = true;
      throw e1;
    }
    var data;
    try{ data = await res.json(); }catch(parseErr){
      var e2 = new Error('offline');
      e2.isNetworkError = true;
      throw e2;
    }
    if (!data.success) throw new Error(data.error || 'Could not save.');
    return true;
  }

  // Saves many {row, field, value} writes in a single request instead of
  // one request per field — this is what makes bulk imports (e.g. Aging 1)
  // fast, since the backend applies the whole batch in one Apps Script
  // execution instead of us waiting on hundreds of round trips.
  async function attemptRemoteBulkSave(branch, updates){
    var res;
    try{
      res = await fetchWithTimeout(state.url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'bulkUpdate', branch:branch, updates:updates }),
        keepalive: true
      }, 20000);
    }catch(networkErr){
      var e1 = new Error('offline');
      e1.isNetworkError = true;
      throw e1;
    }
    var data;
    try{ data = await res.json(); }catch(parseErr){
      var e2 = new Error('offline');
      e2.isNetworkError = true;
      throw e2;
    }
    if (!data.success) throw new Error(data.error || 'Could not save.');
    return data;
  }

  async function flushQueue(){
    if (!state.pendingQueue.length) return;
    if (typeof navigator !== 'undefined' && !navigator.onLine) return;
    var queue = state.pendingQueue.slice();
    for (var i = 0; i < queue.length; i++){
      var item = queue[i];
      try{
        await attemptRemoteSave(item.branch, item.row, item.field, item.value);
        unqueueWrite(item.branch, item.row, item.field);
        if (item.field === 'Auditor Remarks'){
          var syncedName = customerNameFor(item.branch, item.row);
          pushRemarksLogEntry(item.branch, item.row, syncedName, item.value, 'synced', true);
          pushNotification(
            'synced',
            'Offline remarks synced — ' + (syncedName || 'customer'),
            item.branch + ' • Saved to your Google Sheet.',
            { branch: item.branch, row: item.row, status: 'resolved' }
          );
        }
        if (state.selected && state.selected._row === item.row) render();
      }catch(e){
        if (e.isNetworkError){
          state.online = false;
          break;
        } else {
          // The device is online and reached the backend, but the sheet
          // itself rejected this particular save (bad data, a locked
          // sheet, a stale row, etc.) -- surface it instead of silently
          // discarding the queued change, since it can no longer sync on
          // its own.
          unqueueWrite(item.branch, item.row, item.field);
          var failedName = customerNameFor(item.branch, item.row) || 'customer';
          pushNotification('error', 'Could not sync saved change — ' + failedName, item.branch + ' • ' + item.field + ': ' + e.message, {
            branch: item.branch, row: item.row,
            status: 'failed',
            cause: 'The change was saved on this device while offline, but once reconnected the Google Sheet backend rejected it — usually because the row or column no longer exists, the sheet is locked/protected, or the value is no longer valid. Details: ' + e.message,
            solution: 'Open this customer\u2019s record, check the ' + item.field + ' field, and re-enter/save it manually so it isn\u2019t lost.'
          });
        }
      }
    }
    render();
  }

  async function handleSaveRemarks(){
    if (remarksAutoSaveTimer){ clearTimeout(remarksAutoSaveTimer); remarksAutoSaveTimer = null; }
    var val = document.getElementById('remarksInput').value;
    var b = currentBranch();
    var row = state.selected._row;
    clearDraft(b.branch, row);
    state.savingRemarks = true; renderKeepScroll();
    updateLocalField(b.branch, row, 'Auditor Remarks', val);
    var custName = state.selected ? (state.selected['Customer Name'] || '') : '';
    try{
      if (typeof navigator !== 'undefined' && !navigator.onLine){ throw Object.assign(new Error('offline'), { isNetworkError:true }); }
      await attemptRemoteSave(b.branch, row, 'Auditor Remarks', val);
      unqueueWrite(b.branch, row, 'Auditor Remarks');
      state.remarksMsg = 'ok';
      state.online = true;
      // Saved straight to the sheet while online -- no notification needed
      // here since auto-save already covers that case, but it still goes
      // into the "Recent saved remarks" log for easy review.
      pushRemarksLogEntry(b.branch, row, custName, val, 'saved', false);
    }catch(e){
      if (e.isNetworkError){
        state.online = false;
        queueWrite(b.branch, row, 'Auditor Remarks', val, 'Auditor remarks');
        state.remarksMsg = 'queued';
        pushRemarksLogEntry(b.branch, row, custName, val, 'queued', true);
        pushNotification(
          'offline',
          'Remarks saved offline — ' + (custName || 'customer'),
          b.branch + ' • Will sync automatically once you\'re back online.',
          {
            branch: b.branch, row: row,
            status: 'retrying',
            cause: 'This device had no internet connection at the moment of saving, so the remarks could not reach the Google Sheet.',
            solution: 'Nothing to do — the change is safely stored on this device and will sync automatically the next time you\u2019re online. You can check its status any time from this notifications panel.'
          }
        );
      } else {
        state.remarksMsg = 'err:' + e.message;
        pushNotification('error', 'Could not save remarks — ' + (custName || 'customer'), b.branch + ' • ' + e.message, {
          branch: b.branch, row: row,
          status: 'failed',
          cause: 'The device is online and reached the Google Sheet backend, but it rejected the save — usually because the row or column no longer exists, the sheet is locked/protected, or the request timed out. Details: ' + e.message,
          solution: 'Try saving again in a moment. If it keeps failing, check that the "' + b.branch + '" sheet tab and its Auditor Remarks column still exist and aren\u2019t locked, then retry.'
        });
      }
    }
    state.savingRemarks = false;
    renderKeepScroll();
    setTimeout(function(){ state.remarksMsg=''; renderKeepScroll(); }, 3500);
  }

  // "Already made a payment" quick-remark button. Now a real toggle:
  // tapping it when unmarked drops a standard, dated line into the
  // remarks box and saves right away — this is what triggers the
  // Auditor Remarks save path, which also makes the customer's name
  // turn green on the Google Sheet (see syncRemarksHighlight() on the
  // Apps Script side). Tapping it again when already marked UNDOES
  // it — the auto-added line is stripped back out and the remaining
  // remarks are saved as-is, so an accidental tap (or a tap made in
  // error) is never a one-way trip. Typed remarks are never touched
  // either way: only the exact auto-added line is added or removed.
  async function handleAlreadyPaid(){
    if (!state.selected || state.savingRemarks) return;
    var ta = document.getElementById('remarksInput');
    if (!ta) return;
    var current = ta.value || '';
    if (ALREADY_PAID_MARKER_RE.test(current)){
      // Undo: drop only the auto-added marker line(s), keep everything else.
      var lines = current.split('\n').filter(function(line){
        return !ALREADY_PAID_MARKER_RE.test(line);
      });
      ta.value = lines.join('\n').replace(/^\n+/, '');
    } else {
      // Uses the date picked in the little calendar next to this button
      // (defaults to today) rather than always assuming "right now", since
      // the auditor is often logging a payment that actually happened a
      // few days earlier.
      var pickedDate = state.alreadyPaidDate || todayISODate();
      var d = new Date(pickedDate + 'T00:00:00');
      var stamp = isNaN(d.getTime())
        ? new Date().toLocaleDateString('en-PH', { month:'long', day:'numeric', year:'numeric' })
        : d.toLocaleDateString('en-PH', { month:'long', day:'numeric', year:'numeric' });
      var line = 'Customer already made a payment on ' + stamp + '.';
      ta.value = current.trim() ? (line + '\n' + current) : line;
    }
    var b = currentBranch();
    if (b && state.selected) saveDraft(b.branch, state.selected._row, ta.value);
    await handleSaveRemarks();
  }

  async function handleFieldChange(field, newVal){
    var b = currentBranch();
    var row = state.selected._row;
    updateLocalField(b.branch, row, field, newVal);
    renderKeepScroll();
    if (field === 'Unit status' || field === 'Payment mode'){
      // Runs independently of the field save below (different backend
      // column, its own save/queue/error path) -- so the remarks line
      // updates right away instead of waiting on the field's network call.
      syncAutoFieldRemarkLine();
    }
    try{
      if (typeof navigator !== 'undefined' && !navigator.onLine){ throw Object.assign(new Error('offline'), { isNetworkError:true }); }
      await attemptRemoteSave(b.branch, row, field, newVal);
      unqueueWrite(b.branch, row, field);
      state.fieldMsg[field] = 'ok';
      state.online = true;
    }catch(e){
      if (e.isNetworkError){
        state.online = false;
        queueWrite(b.branch, row, field, newVal, field);
        state.fieldMsg[field] = 'queued';
      } else {
        state.fieldMsg[field] = 'err:' + e.message;
      }
    }
    renderKeepScroll();
    setTimeout(function(){ state.fieldMsg[field]=''; renderKeepScroll(); }, 3000);
  }

  async function handleSaveUrl(){
    var v = (state.urlDraft || '').trim();
    if (!v){ state.urlSaveMsg = 'err:Please paste your Apps Script Web app URL.'; render(); return; }
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)){
      state.urlSaveMsg = 'err:That doesn\'t look like an Apps Script Web app URL. It should end in /exec.';
      render();
      return;
    }
    state.savingUrl = true; state.urlSaveMsg = ''; render();
    var previousUrl = state.url;
    state.url = v;
    try{
      await saveUrl(v);
      await fetchData();
      if (state.error){
        state.url = previousUrl;
        await saveUrl(previousUrl);
        state.urlSaveMsg = 'err:' + state.error;
        state.error = '';
      } else {
        state.urlSaveMsg = 'ok';
        state.savingUrl = false;
        render();
        setTimeout(function(){ state.settingsOpen = false; state.urlSaveMsg=''; render(); }, 900);
        return;
      }
    }catch(e){
      state.url = previousUrl;
      state.urlSaveMsg = 'err:' + e.message;
    }
    state.savingUrl = false;
    render();
  }

  function currentBranch(){
    return state.branches.find(function(b){ return b.branch === state.activeBranch; });
  }

  // Extracts the surname from a customer name so we can match on it
  // specifically (e.g. typing "A" shows everyone whose surname starts with A).
  // Supports "Surname, Firstname" format (comma) and falls back to the
  // first word of the name when there's no comma.
  function getSurname(fullName){
    var n = String(fullName || '').trim();
    if (!n) return '';
    if (n.indexOf(',') > -1){
      return n.split(',')[0].trim();
    }
    var parts = n.split(/\s+/);
    return parts[0] || '';
  }

  function filteredRows(){
    var b = currentBranch();
    if (!b) return [];
    var q = state.search.trim().toLowerCase();
    var rows = b.rows;
    if (q){
      rows = rows.filter(function(r){
        var rawName = String(r['Customer Name'] || '');
        var name = rawName.toLowerCase();
        var surname = getSurname(rawName).toLowerCase();
        var model = String(r['Model'] || '').toLowerCase();
        var engine = String(r['Engine No'] || '').toLowerCase();
        // A single letter means "show me everyone whose surname starts
        // with this letter" — keep it strict, don't also match model/engine.
        if (q.length === 1){
          return surname.indexOf(q) === 0;
        }
        return surname.indexOf(q) === 0 || name.indexOf(q) > -1 || model.indexOf(q) > -1 || engine.indexOf(q) > -1;
      });
    }
    if (state.statusFilter){
      if (state.statusFilter === '__blank__'){
        rows = rows.filter(function(r){ return !r['Customer Status']; });
      } else {
        rows = rows.filter(function(r){ return (r['Customer Status'] || '') === state.statusFilter; });
      }
    } else {
      // Landing view (no status explicitly picked): only BNEW/REPO/RSTR -
      // OD/DEL rows, so the table renders faster. Selecting any specific
      // status (an ADV/CU one, or "— Unclassified —") from the dropdown or
      // a pill sets state.statusFilter and takes the branch above instead.
      rows = rows.filter(function(r){
        var status = String(r['Customer Status'] || '').replace(/\s+/g, ' ').trim().toUpperCase();
        return LANDING_DEFAULT_CATEGORIES.indexOf(status) !== -1;
      });
    }
    return rows;
  }

  function branchStatusOptions(b){
    var seen = {};
    var out = [];
    var fromDropdown = (b && b.dropdowns && b.dropdowns['Customer Status']) || [];
    fromDropdown.forEach(function(o){ if (o && !seen[o]){ seen[o]=1; out.push(o); } });
    (b ? b.rows : []).forEach(function(r){
      var v = r['Customer Status'];
      if (v && !seen[v]){ seen[v]=1; out.push(v); }
    });
    return out;
  }

  // Counts how many customers fall under each Customer Status value
  // (e.g. BN- OD, BN-DEL, REPO- OD...) for the currently selected branch,
  // so the totals can be shown at the top of the dashboard, distinct from
  // the overall "Customers" / "Current results" metrics.
  function branchStatusCounts(b){
    var counts = {};
    var order = [];
    var blank = 0;
    (b ? b.rows : []).forEach(function(r){
      var v = r['Customer Status'];
      if (!v){ blank++; return; }
      if (!counts[v]){ counts[v] = 0; order.push(v); }
      counts[v]++;
    });
    var out = order.map(function(v){ return { status: v, count: counts[v] }; });
    if (blank) out.push({ status: '__blank__', count: blank });
    return out;
  }

          '<svg class="status-dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
        (state.statusDropdownOpen ?
          '<div class="status-dropdown-panel">' +
            '<div class="status-dropdown-list">' +
              '<div class="status-dropdown-item' + (!state.statusFilter ? ' active' : '') + '">' +
                '<button type="button" class="status-item-select" data-status="">' +
                  '<span class="status-item-name">All statuses</span>' +
                '</button>' +
              '</div>' +
              statusCountsNow.map(function(sc){
                var isBlank = sc.status === '__blank__';
                var label = isBlank ? 'Unclassified' : sc.status;
                var isActive = state.statusFilter === sc.status;
                return '<div class="status-dropdown-item' + (isActive ? ' active' : '') + '">' +
                  '<button type="button" class="status-item-select" data-status="' + esc(sc.status) + '">' +
                    '<span class="status-item-name">' + esc(label) + '</span>' +
                    '<span class="status-item-count">' + sc.count + '</span>' +
                  '</button>' +
                '</div>';
              }).join('') +
            '</div>' +
          '</div>'
        : '') +
      '</div>' : '';

    // All the summary pills (with-remarks / recently-saved / status
    // breakdown / total) in a single embedded row inside the header,
    // instead of stacked blocks in main — one row, no wrapping.
    // Collapsible: a small chevron toggle sits at the far left; the pills
    // are hidden by default and reveal left-to-right when expanded.
    // "With remarks" and "Recently saved" now live inside the Activity
    // modal (opened via the topbar Activity icon) instead of as
    // always-visible pills under the search bar, so this row is empty.
    var headerPillsHtml = '';

    var tableRows = rows.map(function(r){
      var remarks = r['Auditor Remarks'] || '';
      var pending = rowHasPending(b.branch, r._row);
      var rowDraft = loadDraft(b.branch, r._row);
      var rowHasDraft = rowDraft !== null && rowDraft !== remarks;
      return '<tr data-row="' + r._row + '">' +
        '<td class="name' + (r['Auditor Remarks'] ? ' has-remarks' : '') + '">' +
          '<span class="name-line">' +
            (pending ? '<span class="pending-dot" title="Unsynced changes — will save automatically when back online"></span>' : '') +
            (rowHasDraft ? '<span class="draft-dot" title="Unsaved draft remarks on this device"></span>' : '') +
            esc(r['Customer Name']) +
          '</span>' +

          // place of the chevron column (which is hidden on mobile — see
          // the max-width:680px block). Hidden on desktop by default since
          // the desktop view already has its own status-chip column.

        '</td>' +
        '<td>' + esc(r['Model']) + '</td>' +
        '<td class="mono">' + esc(r['Engine No']) + '</td>' +
        '<td>' + esc(fmtValue('Last Payment', getField(r, 'Last Payment'))) + '</td>' +
        '<td class="mono amount-red">' + esc(fmtValue('Outstanding Balance', getField(r, 'Outstanding Balance'))) + '</td>' +
        '<td class="mono amount-red">' + esc(fmtValue('Total Due this Month', getTotalDue(r))) + '</td>' +

      '</tr>';

  function fmtNotifTime(iso){
    try{
      var d = new Date(iso);
      var diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diffSec < 5) return 'just now';
      if (diffSec < 60) return diffSec + 's ago';
      var diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return diffMin + 'm ago';
      var diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + 'h ago';
      return d.toLocaleDateString('en-PH', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }catch(e){ return ''; }
  }

  function notifPanelHtml(){
    var pending = getPendingRemarksList();
    var pendingHtml = pending.length
      ? '<div class="notif-section-label">Needs saving/syncing (' + pending.length + ')</div>' +
        pending.map(function(p){
          var badge = p.status === 'queued'
            ? '<span class="status-pill queued">Queued</span>'
            : '<span class="status-pill draft">Draft</span>';
          return '<div class="notif-pending-row" data-jump-row="' + p.row + '" data-jump-branch="' + esc(p.branch) + '">' +
            '<span class="npr-name">' + esc(p.customerName) +
              '<span class="npr-branch">' + esc(p.branch) + '</span>' +
            '</span>' +
            badge +
          '</div>';
        }).join('')
      : '';

    if (!state.notifications.length && !pending.length){
      return '<div class="notif-panel" id="notifPanel">' +
        '<div class="notif-panel-header"><span>Notifications</span></div>' +
        '<div class="notif-panel-empty">No uploads or syncs yet. Import history will show up here.</div>' +
      '</div>';
    }

    var items = state.notifications.map(function(n){
      // Notifications carrying cause/solution info (system errors: upload,
      // fetch/load, save, sync, connection problems) open the full detail
      // modal on tap. Others that just reference a customer record (e.g.
      // "remarks saved offline") keep the older jump-to-row behavior.
      var hasDetails = !!(n.cause || n.solution);
      var clickable = hasDetails || !!(n.branch && n.row);
      var pill = statusPillFor(n.status);

  function initialsFor(name){
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  // Tracks which row the drawer's entrance animation has already played
  // for. Every re-render rebuilds the .drawer/.overlay DOM nodes from
  // scratch (innerHTML replace), which used to retrigger their CSS
  // fade/slide-in animation EVERY time — on every dropdown click, every
  // remarks keystroke-triggered save, etc. That replaying animation was
  // the main visible "flicker/jump". Now the animation only plays the
  // first time a given customer's drawer opens; subsequent re-renders
  // while it's still open for the same row render it with animation
  // already-settled (no replay).
  var drawerAnimatedForRow = null;

  function drawerHtml(){
    if (!state.selected){ drawerAnimatedForRow = null; return '<div class="overlay" id="overlay"></div>'; }
    var r = state.selected;
    var isFreshOpen = drawerAnimatedForRow !== r._row;
    drawerAnimatedForRow = r._row;
    var b = currentBranch();
    var headers = (b ? b.headers : Object.keys(r)).slice();
    var skip = {'Customer Name':1, 'Auditor Remarks':1, 'Old Remarks':1, 'Customer Status':1, 'Unit status':1, 'Payment mode':1, '_row':1};

    // Some sheets/branches spell this header slightly differently
    // ("Total Due this Month" vs "Total Due This Month"). Make sure the
    // field always shows up even if its exact casing isn't in b.headers.
    var hasDueThisMonth = headers.some(function(h){
      var hNorm = String(h).toLowerCase().replace(/\s+/g, ' ').trim();
      return TOTAL_DUE_ALIASES.some(function(alias){ return alias.toLowerCase() === hNorm; });
    });
    if (!hasDueThisMonth && getTotalDue(r) !== '') headers.push('Total Due this Month');

    var redFieldsNorm = {'outstanding balance':1};
    TOTAL_DUE_ALIASES.forEach(function(alias){ redFieldsNorm[alias.toLowerCase()] = 1; });
    function isRed(h){ return !!redFieldsNorm[String(h).toLowerCase().replace(/\s+/g, ' ').trim()]; }

    var fields = headers.filter(function(h){ return !skip[h] && h !== ''; }).map(function(h){
      return '<div class="field"><div class="k">' + esc(h) + '</div><div class="v' + (isRed(h) ? ' amount-red' : '') + '">' + esc(fmtValue(h, getField(r, h))) + '</div></div>';
    }).join('');

    // Quick-remark button: one tap drops a standard "already made a
    // payment" line into Auditor Remarks and saves it immediately (which
    // also triggers the sheet's green name-highlight, same as any other
    // remarks save). The auditor can still freely type/edit remarks
    // before or after tapping this — it only pre-fills a line, it never
    // locks the textarea. Shown as "already marked" (checked look) once
    // that line is present in the saved remarks, so it's obvious at a
    // glance without having to open the remarks box.
    var alreadyPaidMarked = ALREADY_PAID_MARKER_RE.test(String(r['Auditor Remarks'] || ''));
    var alreadyPaidIcon = alreadyPaidMarked
      ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
      : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="8"/></svg>';
    // Little calendar so the auditor can back-date the remark to when the
    // customer actually paid, instead of it always saying "today". Only
    // shown before marking -- once marked, the date is already baked into
    // the saved remark line, so this hides to avoid implying it's still
    // editable (undo first, then re-mark with a different date if needed).
    var alreadyPaidDateHtml = alreadyPaidMarked ? '' :
      '<div class="already-paid-date-row">' +
        '<label for="alreadyPaidDateInput" class="already-paid-date-label">Date paid</label>' +
        '<input type="date" class="already-paid-date-input" id="alreadyPaidDateInput" value="' +
          esc(state.alreadyPaidDate || todayISODate()) + '"' + (state.savingRemarks ? ' disabled' : '') + '>' +
      '</div>';

    var alreadyPaidBtnHtml =
      '<div class="field field-action">' +
        alreadyPaidDateHtml +
        '<button type="button" class="already-paid-btn' + (alreadyPaidMarked ? ' is-marked' : '') + '" id="alreadyPaidBtn"' + (state.savingRemarks ? ' disabled' : '') + '>' +
          '<span class="icon-badge">' + alreadyPaidIcon + '</span>' +
          '<span class="apb-text">' +
            (state.savingRemarks ? 'Saving...' : (alreadyPaidMarked ? 'Not made a payment' : 'Already made a payment')) +
            (alreadyPaidMarked && !state.savingRemarks ? '<span class="apb-hint">Tap to undo</span>' : '') +
          '</span>' +
        '</button>' +
      '</div>';

    var remarksSaveStatus = '';
    if (state.remarksMsg === 'ok') remarksSaveStatus = '<span class="save-status show"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Saved to Google Sheet</span>';
    else if (state.remarksMsg === 'queued') remarksSaveStatus = '<span class="save-status show queued"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><polyline points="12 6 12 12 16 14"/></svg>Saved on this device — will sync when back online</span>';
    else if (state.remarksMsg && state.remarksMsg.indexOf('err:') === 0) remarksSaveStatus = '<span class="save-status show err">Could not save: ' + esc(state.remarksMsg.slice(4)) + '</span>';

    var pendingBanner = rowHasPending(b.branch, r._row)
      ? '<div class="pending-banner"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><polyline points="12 6 12 12 16 14"/></svg>This record has changes saved on this device that haven\'t synced to the Google Sheet yet.</div>'
      : '';

    var savedRemarks = r['Auditor Remarks'] || '';
    var draftRemarks = loadDraft(b.branch, r._row);
    var hasDraft = draftRemarks !== null && draftRemarks !== savedRemarks;
    var remarksBoxValue = hasDraft ? draftRemarks : savedRemarks;
    var draftStatus = hasDraft
      ? '<div class="draft-status"><span class="dot"></span>Draft — not saved yet. Your text stays here even if you go offline or close this.</div>'
      : '';

    return (
      '<div class="overlay open' + (isFreshOpen ? '' : ' no-anim') + '" id="overlay">' +
        '<div class="drawer' + (isFreshOpen ? '' : ' no-anim') + '">' +
          '<div class="drawer-head">' +
            '<button class="close" id="closeDrawer">✕</button>' +
            '<div class="head-text">' +
              '<h2>' + esc(r['Customer Name']) + '</h2>' +
              '<div class="sub">' + esc(b ? b.branch : '') + '</div>' +
            '</div>' +
          '</div>' +

        '</div>' +

  }

  // List of customers on the active branch that already have Auditor
  // Remarks filled in — opened by tapping the "With remarks" card.
  function remarksDoneModalHtml(){
    if (!state.remarksDoneOpen) return '';
    var b = currentBranch();
    var done = (b ? b.rows : []).filter(function(r){ return String(r['Auditor Remarks'] || '').trim() !== ''; });
    var rowsHtml = done.length
      ? done.map(function(r){
          return '<div class="breakdown-row" data-jump-row="' + r._row + '">' +
            '<span>' + esc(r['Customer Name']) + '</span>' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</div>';
        }).join('')
      : '<div class="sm-hint">No customers have remarks yet on this branch.</div>';
    return (
      '<div class="settings-overlay open" id="remarksDoneOverlay">' +
        '<div class="settings-modal" style="max-width:420px;">' +
          '<div class="sm-head"><div><h3>Already done</h3>' +
            '<p>' + esc(b ? b.branch : '') + ' — ' + done.length + ' of ' + (b ? b.rows.length : 0) + ' with remarks. Tap a name to open it.</p></div></div>' +
          '<div class="sm-body">' +
            '<div class="breakdown-list">' + rowsHtml + '</div>' +
            '<div class="sm-actions"><button class="btn ghost" id="closeRemarksDoneBtn">Close</button></div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // "Add branch" -- lets someone create a brand-new branch/tab on the
  // Google Sheet directly from the dashboard, instead of having to open
  // the spreadsheet and duplicate a tab by hand. By default it duplicates
  // an existing branch's layout (headers, dropdown/data-validation rules,
  // formatting) so the new branch works with the dashboard immediately,
  // then clears out the copied data rows so it starts empty.
  function openAddBranchModal(){
    state.menuOpen = false;
    state.addBranchName = '';
    state.addBranchMode = 'duplicate';
    state.addBranchSource = state.activeBranch || (state.branches[0] && state.branches[0].branch) || '';
    state.addBranchMsg = '';
    state.addBranchOpen = true;
    render();
  }

  function addBranchModalHtml(){
    if (!state.addBranchOpen) return '';

    var msg = '';
    if (state.addBranchMsg === 'ok') msg = '<div class="okbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Branch created.</div>';
    else if (state.addBranchMsg && state.addBranchMsg.indexOf('err:') === 0) msg = '<div class="errbox">' + esc(state.addBranchMsg.slice(4)) + '</div>';

    var sourceOptions = state.branches.map(function(b){
      return '<option value="' + esc(b.branch) + '"' + (b.branch === state.addBranchSource ? ' selected' : '') + '>' + esc(b.branch) + '</option>';
    }).join('');

    return (
      '<div class="settings-overlay open" id="addBranchOverlay">' +
        '<div class="settings-modal">' +
          '<div class="sm-head"><div><h3>Add branch</h3><p>Creates a new tab on your Google Sheet</p></div></div>' +
          '<div class="sm-body">' +
            '<label>Branch name</label>' +
            '<input type="text" id="addBranchNameInput" value="' + esc(state.addBranchName) + '" placeholder="e.g. Cebu" />' +
            '<div class="sm-hint">This becomes the new tab\'s name on the Google Sheet, so it can\'t contain [ ] * ? / \\ or : and can\'t already be in use.</div>' +
            '<div style="height:1px;background:rgba(23,179,163,0.28);margin:14px 0;"></div>' +
            '<label>Starting layout</label>' +
            '<div class="sm-actions" style="justify-content:flex-start;gap:8px;margin-bottom:10px;">' +
              '<label style="display:flex;align-items:center;gap:6px;font-weight:normal;">' +
                '<input type="radio" name="addBranchMode" value="duplicate"' + (state.addBranchMode === 'duplicate' ? ' checked' : '') + ' id="addBranchModeDuplicate" /> Copy columns/dropdowns from an existing branch' +
              '</label>' +
            '</div>' +
            (state.addBranchMode === 'duplicate' ?
              '<select id="addBranchSourceSelect">' + sourceOptions + '</select>'
            : '') +
            '<div class="sm-hint">The new branch starts empty (no customer rows) — only the column headers, dropdown lists, and formatting are copied over.</div>' +
            msg +
            '<div class="sm-actions">' +
              '<button class="btn gold" id="createBranchBtn"' + (state.addBranchSaving ? ' disabled' : '') + '>' + (state.addBranchSaving ? 'Creating...' : 'Create branch') + '</button>' +
              '<button class="btn ghost" id="cancelAddBranchBtn">Cancel</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // "Delete branch" -- lets someone remove a tab from the Google Sheet
  // straight from the branch filter dropdown, instead of having to open
  // the spreadsheet and delete it by hand. Always asks for confirmation
  // first, and refuses (both here and on the backend) to delete the last
  // remaining branch, since the dashboard needs at least one to show.
  function openDeleteBranchModal(branchName){
    state.menuOpen = false;
    state.branchDropdownOpen = false;
    state.deleteBranchTarget = branchName;
    state.deleteBranchMsg = '';
    state.deleteBranchOpen = true;
    render();
  }

  function deleteBranchModalHtml(){
    if (!state.deleteBranchOpen) return '';

    var target = state.branches.find(function(b){ return b.branch === state.deleteBranchTarget; });
    var rowCount = target ? target.rows.length : 0;
    var isLast = state.branches.length <= 1;

    var msg = '';
    if (state.deleteBranchMsg === 'ok') msg = '<div class="okbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Branch deleted.</div>';
    else if (state.deleteBranchMsg && state.deleteBranchMsg.indexOf('err:') === 0) msg = '<div class="errbox">' + esc(state.deleteBranchMsg.slice(4)) + '</div>';

    return (
      '<div class="settings-overlay open" id="deleteBranchOverlay">' +
        '<div class="settings-modal" style="max-width:420px;">' +
          '<div class="sm-head"><div><h3>Delete branch</h3><p>Removes the tab from your Google Sheet — this can\'t be undone.</p></div></div>' +
          '<div class="sm-body">' +
            (isLast ?
              '<div class="errbox">"' + esc(state.deleteBranchTarget) + '" is the only branch left — add another branch before deleting this one.</div>'
            :
              '<div class="sm-hint">You\'re about to permanently delete <strong>' + esc(state.deleteBranchTarget) + '</strong>' +
              (rowCount ? ', including its ' + rowCount + ' customer row' + (rowCount === 1 ? '' : 's') + '.' : ', which has no customer rows yet.') +
              ' This removes the tab from the Google Sheet itself, not just from this dashboard.</div>'
            ) +
            msg +
            '<div class="sm-actions">' +
              (!isLast ? '<button class="btn danger" id="confirmDeleteBranchBtn"' + (state.deleteBranchSaving ? ' disabled' : '') + '>' + (state.deleteBranchSaving ? 'Deleting...' : 'Delete branch') + '</button>' : '') +
              '<button class="btn ghost" id="cancelDeleteBranchBtn">' + (isLast ? 'Close' : 'Cancel') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  async function doDeleteBranch(){
    var branchName = state.deleteBranchTarget;
    if (!branchName) return;
    state.deleteBranchSaving = true; state.deleteBranchMsg = ''; render();
    try{
      var res = await fetchWithTimeout(state.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'deleteBranch', branchName: branchName })
      }, 30000);
      var data = await res.json();
      if (!data.success) throw new Error(data.error || 'Could not delete the branch.');
      state.deleteBranchMsg = 'ok';
      pushNotification('success', 'Branch deleted — ' + branchName, 'The "' + branchName + '" tab was removed from your Google Sheet.', { status: 'success' });
      await fetchData();
      // If the branch we just deleted was the active one, fall back to
      // whatever branch is now first in the list so the dashboard isn't
      // left pointing at a branch that no longer exists.
      if (state.activeBranch === branchName){
        state.activeBranch = (state.branches[0] && state.branches[0].branch) || '';
      }
      state.deleteBranchSaving = false;
      render();
      setTimeout(function(){ state.deleteBranchOpen = false; state.deleteBranchTarget = ''; state.deleteBranchMsg = ''; render(); }, 900);
      return;
    }catch(e){
      state.deleteBranchMsg = 'err:' + e.message;
      pushNotification('error', 'Could not delete branch — ' + branchName, e.message, {
        status: 'failed',
        cause: 'The dashboard reached the Google Sheet backend but the branch could not be deleted — usually because it was already removed, it\u2019s the last remaining branch, or the request timed out.',
        solution: 'Tap Sync now to refresh the branch list, or check your connection and try again.'
      });
    }
    state.deleteBranchSaving = false;
    render();
  }

  async function doCreateBranch(){
    var name = (state.addBranchName || '').trim();
    if (!name){ state.addBranchMsg = 'err:Please enter a branch name.'; render(); return; }
    if (/[\[\]\*\?\/\\:]/.test(name)){ state.addBranchMsg = 'err:Branch name cannot contain any of: [ ] * ? / \\ :'; render(); return; }
    if (state.branches.some(function(b){ return b.branch.toLowerCase() === name.toLowerCase(); })){
      state.addBranchMsg = 'err:A branch named "' + name + '" already exists.';
      render();
      return;
    }
    state.addBranchSaving = true; state.addBranchMsg = ''; render();
    try{
      var body = { action: 'createBranch', branchName: name };
      if (state.addBranchMode === 'duplicate' && state.addBranchSource) body.templateBranch = state.addBranchSource;
      var res = await fetchWithTimeout(state.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }, 30000);
      var data = await res.json();
      if (!data.success) throw new Error(data.error || 'Could not create the branch.');
      state.addBranchMsg = 'ok';
      pushNotification('success', 'Branch created — ' + name, 'A new tab named "' + name + '" was added to your Google Sheet.', { status: 'success' });
      await fetchData();
      state.activeBranch = name;
      state.addBranchSaving = false;
      render();
      setTimeout(function(){ state.addBranchOpen = false; state.addBranchName = ''; state.addBranchMsg=''; render(); }, 900);
      return;
    }catch(e){
      state.addBranchMsg = 'err:' + e.message;
      pushNotification('error', 'Could not create branch — ' + name, e.message, {
        status: 'failed',
        cause: 'The dashboard reached the Google Sheet backend but the branch could not be created — usually because the name is already in use, contains characters Google Sheets doesn\u2019t allow in a tab name, or the request timed out.',
        solution: 'Try a different name, or check your connection and tap Create branch again.'
      });
    }
    state.addBranchSaving = false;
    render();
  }

  function bindEvents(){
    var branchToggle = document.getElementById('branchDropdownToggle');
    if (branchToggle){
      branchToggle.onclick = function(e){
        e.stopPropagation();
        state.branchDropdownOpen = !state.branchDropdownOpen;
        render();
      };
    }
    document.querySelectorAll('.branch-item-select').forEach(function(item){
      item.onclick = function(e){
        e.stopPropagation();
        state.activeBranch = item.getAttribute('data-branch');
        state.search = '';
        state.statusFilter = '';
        state.branchDropdownOpen = false;
        render();
      };
    });

  function renderKeepFocus(){
    var caret = document.getElementById('searchInput') ? document.getElementById('searchInput').selectionStart : null;

  // Re-renders without visually jumping back to the top. render() rebuilds
  // the whole screen from scratch, which normally resets scroll position to
  // 0 -- jarring when it happens mid-save while looking at a customer's
  // remarks. This captures the outer page scroll, the detail drawer's own
  // scroll, and the remarks textarea's cursor position beforehand, then
  // restores all three right after.
  function renderKeepScroll(){
    var pageY = window.scrollY;
    // The drawer's actual scrollable element is .drawer itself (it has
    // overflow-y:auto) — NOT .drawer-body, which has no overflow set and
    // never scrolls on its own. Capturing .drawer-body here was a no-op,
    // which is why the dropdown/remarks drawer used to snap back to the
    // top on every click instead of staying where you were scrolled to.
    var drawerEl = document.querySelector('.drawer');
    var drawerY = drawerEl ? drawerEl.scrollTop : null;
    var ta = document.getElementById('remarksInput');
    var hadFocus = ta && document.activeElement === ta;
    var caretPos = hadFocus ? ta.selectionStart : null;

    render();

    window.scrollTo(0, pageY);
    var newDrawerEl = document.querySelector('.drawer');
    if (newDrawerEl && drawerY !== null){ newDrawerEl.scrollTop = drawerY; }
    var newTa = document.getElementById('remarksInput');
    if (newTa && hadFocus){
      newTa.focus();
      if (caretPos !== null) newTa.setSelectionRange(caretPos, caretPos);
    }
  }

  (async function init(){

    // starts from a blank screen while the network request is in flight.
    if (loadCachedBranches()){
      if (!state.branches.some(function(b){ return b.branch === state.activeBranch; })){
        state.activeBranch = state.branches[0].branch;
      }
      applyPendingToBranches();
      render();
    }
    if (state.url){
      await fetchData();
      flushQueue();
    } else {
      render();
    }
    startClock();
  })();
})();

<script>
  // ---- Logo online/offline toggle button ----
  // Tapping the logo in the top bar toggles a connection-status indicator:
  // green smoke puffs briefly when switching to "online", red smoke lingers
  // while "offline". This is a visual status toggle layered on top of the
  // logo; it also follows the browser's real connectivity automatically.
  (function () {
    var STATUS_KEY = 'logoConnStatus';

    function getInitialStatus() {
      try {
        var saved = window.sessionStorage.getItem(STATUS_KEY);
        if (saved === 'online' || saved === 'offline') return saved;
      } catch (e) {}
      return (typeof navigator !== 'undefined' && navigator.onLine === false) ? 'offline' : 'online';
    }

    var currentStatus = getInitialStatus();

    function applyStatus(status, animate) {
      currentStatus = status;
      try { window.sessionStorage.setItem(STATUS_KEY, status); } catch (e) {}
      var stamps = document.querySelectorAll('.brand .stamp');
      stamps.forEach(function (el) {
        el.setAttribute('data-conn', status);
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-pressed', status === 'online' ? 'true' : 'false');
        el.setAttribute('title', status === 'online'
          ? 'Online — tap to mark offline'
          : 'Offline — tap to mark online');
        if (animate && status === 'online') {
          el.classList.remove('puff-green');
          void el.offsetWidth; // restart animation
          el.classList.add('puff-green');
          setTimeout(function () { el.classList.remove('puff-green'); }, 1200);
        }
      });
    }

    function toggleStatus() {
      applyStatus(currentStatus === 'online' ? 'offline' : 'online', true);
    }

    document.addEventListener('click', function (e) {
      var stamp = e.target && e.target.closest ? e.target.closest('.brand .stamp') : null;
      if (!stamp) return;
      e.preventDefault();
      toggleStatus();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var stamp = e.target && e.target.closest ? e.target.closest('.brand .stamp') : null;
      if (!stamp) return;
      e.preventDefault();
      toggleStatus();
    });

    // Keep it honest with the browser's real connectivity too.
    window.addEventListener('online', function () { applyStatus('online', true); });
    window.addEventListener('offline', function () { applyStatus('offline', false); });

    // The app re-renders #app wholesale on every state change, which wipes
    // out the data-conn attribute we set on .stamp. Re-apply it whenever
    // the DOM underneath #app changes.
    var appEl = document.getElementById('app');
    if (appEl && typeof MutationObserver !== 'undefined') {
      var mo = new MutationObserver(function () { applyStatus(currentStatus, false); });
      mo.observe(appEl, { childList: true, subtree: true });
    }

    applyStatus(currentStatus, false);
  })();
</script>
