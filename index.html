  function bindEvents(){
    var sel = document.getElementById('branchSelect');
    if (sel){
      sel.onchange = function(){ state.activeBranch = sel.value; state.search=''; state.statusFilter=''; render(); };
    }
    var statusSel = document.getElementById('statusFilter');
    if (statusSel){
      statusSel.onchange = function(){ state.statusFilter = statusSel.value; render(); };
    }
    var s = document.getElementById('searchInput');
    if (s){
      s.oninput = function(e){ state.search = e.target.value; renderKeepFocus(); };
    }
    var refresh = document.getElementById('refreshBtn');
    if (refresh) refresh.onclick = function(){ flushQueue().then(fetchData); };
    var settings = document.getElementById('settingsBtn');
    if (settings) settings.onclick = function(e){
      e.stopPropagation();
      state.menuOpen = !state.menuOpen;
      render();
    };
    if (state.menuOpen){
      // close the menu on any click outside it
      setTimeout(function(){
        document.addEventListener('click', function closeMenu(e){
          var wrap = document.querySelector('.settings-menu-wrap');
          if (wrap && !wrap.contains(e.target)){
            state.menuOpen = false;
            render();
          }
          document.removeEventListener('click', closeMenu);
        }, { once: true });
      }, 0);
    }
    var openConnSettingsBtn = document.getElementById('openConnSettingsBtn');
    if (openConnSettingsBtn) openConnSettingsBtn.onclick = function(){
      state.menuOpen = false;
      state.urlDraft = state.url;
      state.urlSaveMsg = '';
      state.settingsOpen = true;
      render();
    };

    var settingsOverlay = document.getElementById('settingsOverlay');
    if (settingsOverlay){
      settingsOverlay.onclick = function(e){ if (e.target.id === 'settingsOverlay'){ state.settingsOpen=false; render(); } };
    }
    var cancelSettings = document.getElementById('cancelSettingsBtn');
    if (cancelSettings) cancelSettings.onclick = function(){ state.settingsOpen=false; render(); };
    var urlInput = document.getElementById('urlSettingsInput');
    if (urlInput){
      urlInput.oninput = function(e){ state.urlDraft = e.target.value; };
    }
    var saveUrlBtn = document.getElementById('saveUrlBtn');
    if (saveUrlBtn) saveUrlBtn.onclick = handleSaveUrl;

    var importBtn = document.getElementById('importAgingBtn');
    if (importBtn) importBtn.onclick = function(){
      state.menuOpen = false;
      state.importOpen = true;
      state.importBranch = state.activeBranch || '';
      state.importFileName = '';
      state.importRows = [];
      state.importStatus = '';
      render();
    };
    var downloadBtn = document.getElementById('downloadBranchBtn');
    if (downloadBtn) downloadBtn.onclick = function(){ state.menuOpen = false; render(); downloadCurrentBranch(); };
    var printBtn = document.getElementById('printBranchBtn');
    if (printBtn) printBtn.onclick = function(){ state.menuOpen = false; render(); printCurrentBranch(); };
    var importOverlay = document.getElementById('importOverlay');
    if (importOverlay){
      importOverlay.onclick = function(e){ if (e.target.id === 'importOverlay'){ state.importOpen=false; render(); } };
    }
    var cancelImportBtn = document.getElementById('cancelImportBtn');
    if (cancelImportBtn) cancelImportBtn.onclick = function(){ state.importOpen=false; render(); };
    var importFileInput = document.getElementById('importFileInput');
    if (importFileInput){
      importFileInput.onchange = function(e){
        if (e.target.files && e.target.files[0]) handleImportFile(e.target.files[0]);
      };
    }
    var importBranchSelect = document.getElementById('importBranchSelect');
    if (importBranchSelect){
      importBranchSelect.onchange = function(){ state.importBranch = importBranchSelect.value; };
    }
    var doImportBtn = document.getElementById('doImportBtn');
    if (doImportBtn) doImportBtn.onclick = doImport;

    var import1Btn = document.getElementById('importAging1Btn');
    if (import1Btn) import1Btn.onclick = function(){
      state.menuOpen = false;
      state.import1Open = true;
      state.import1Branch = state.activeBranch || '';
      state.import1FileName = '';
      state.import1Rows = [];
      state.import1Status = '';
      render();
    };
    var import1Overlay = document.getElementById('import1Overlay');
    if (import1Overlay){
      import1Overlay.onclick = function(e){ if (e.target.id === 'import1Overlay'){ state.import1Open=false; render(); } };
    }
    var cancelImport1Btn = document.getElementById('cancelImport1Btn');
    if (cancelImport1Btn) cancelImport1Btn.onclick = function(){ state.import1Open=false; render(); };
    var import1FileInput = document.getElementById('import1FileInput');
    if (import1FileInput){
      import1FileInput.onchange = function(e){
        if (e.target.files && e.target.files[0]) handleImportFile1(e.target.files[0]);
      };
    }
    var import1BranchSelect = document.getElementById('import1BranchSelect');
    if (import1BranchSelect){
      import1BranchSelect.onchange = function(){ state.import1Branch = import1BranchSelect.value; render(); };
    }
    var doImport1Btn = document.getElementById('doImport1Btn');
    if (doImport1Btn) doImport1Btn.onclick = doImport1;

    var importRemarksBtn = document.getElementById('importRemarksBtn');
    if (importRemarksBtn) importRemarksBtn.onclick = function(){
      state.menuOpen = false;
      state.importRemarksOpen = true;
      state.importRemarksBranch = state.activeBranch || '';
      state.importRemarksFileName = '';
      state.importRemarksRows = [];
      state.importRemarksStatus = '';
      render();
    };
    var importRemarksOverlay = document.getElementById('importRemarksOverlay');
    if (importRemarksOverlay){
      importRemarksOverlay.onclick = function(e){ if (e.target.id === 'importRemarksOverlay'){ state.importRemarksOpen=false; render(); } };
    }
    var cancelImportRemarksBtn = document.getElementById('cancelImportRemarksBtn');
    if (cancelImportRemarksBtn) cancelImportRemarksBtn.onclick = function(){ state.importRemarksOpen=false; render(); };
    var importRemarksFileInput = document.getElementById('importRemarksFileInput');
    if (importRemarksFileInput){
      importRemarksFileInput.onchange = function(e){
        if (e.target.files && e.target.files[0]) handleImportRemarksFile(e.target.files[0]);
      };
    }
    var importRemarksBranchSelect = document.getElementById('importRemarksBranchSelect');
    if (importRemarksBranchSelect){
      importRemarksBranchSelect.onchange = function(){ state.importRemarksBranch = importRemarksBranchSelect.value; render(); };
    }
    var doImportRemarksBtn = document.getElementById('doImportRemarksBtn');
    if (doImportRemarksBtn) doImportRemarksBtn.onclick = doImportRemarks;

    document.querySelectorAll('tbody tr').forEach(function(el){
      el.onclick = function(){
        var rowNum = parseInt(el.getAttribute('data-row'), 10);
        var b = currentBranch();
        state.selected = b.rows.find(function(x){ return x._row === rowNum; });
        state.remarksMsg = '';
        state.fieldMsg = {};
        state.micError = '';
        state.openPicker = '';
        render();
      };
    });
    var overlay = document.getElementById('overlay');
    if (overlay){
      overlay.onclick = function(e){ if (e.target.id === 'overlay'){ stopMic(); state.selected=null; state.openPicker=''; render(); } };
    }
    var closeBtn = document.getElementById('closeDrawer');
    if (closeBtn) closeBtn.onclick = function(){ stopMic(); state.selected=null; state.openPicker=''; render(); };
    var saveBtn = document.getElementById('saveBtn');
    if (saveBtn) saveBtn.onclick = handleSaveRemarks;
    var remarksInputEl = document.getElementById('remarksInput');
    if (remarksInputEl){
      remarksInputEl.oninput = function(e){
        var b = currentBranch();
        if (b && state.selected) saveDraft(b.branch, state.selected._row, e.target.value);
      };
    }
    document.querySelectorAll('[data-toggle-field]').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var f = btn.getAttribute('data-toggle-field');
        state.openPicker = (state.openPicker === f) ? '' : f;
        render();
      };
    });
    document.querySelectorAll('.pill-option').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var f = btn.getAttribute('data-field');
        var v = btn.getAttribute('data-value');
        state.openPicker = '';
        handleFieldChange(f, v);
      };
    });
    var micBtn = document.getElementById('micBtn');
    if (micBtn) micBtn.onclick = handleMicToggle;
  }

  function renderKeepFocus(){
    var caret = document.getElementById('searchInput') ? document.getElementById('searchInput').selectionStart : null;
    render();
    var s = document.getElementById('searchInput');
    if (s){
      s.focus();
      if (caret !== null) s.setSelectionRange(caret, caret);
    }
  }

  (async function init(){
    document.addEventListener('click', function(){
      if (state.openPicker){ state.openPicker = ''; render(); }
    });
    await loadUrl();
    await loadPendingQueue();
    if (state.url){
      await fetchData();
      flushQueue();
    } else {
      render();
    }
    startClock();
  })();
})();
</script>
